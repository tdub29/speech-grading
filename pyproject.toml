[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orator-speech-grading"
version = "0.1.0"
description = "Maximal open-source speech grading: fillers, weak words, tripped-up moments, pace, prosody."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2",
    "jinja2>=3",
    "textstat>=0.7",
    "lexicalrichness>=0.5",
    "nltk>=3.8",
    "proselint>=0.13",
]

[project.optional-dependencies]
# Word-choice via Claude API (offline lexicon fallback always works without this).
llm = ["anthropic>=0.40"]
# Default MIT ASR backend.
asr = ["faster-whisper>=1.0"]
# Optional acoustic prosody track.
acoustic = ["praat-parselmouth>=0.4", "librosa>=0.10", "numpy>=1.24"]
# Optional opt-in non-commercial high-accuracy ASR.
crisper = ["torch>=2.0", "transformers"]
dev = ["pytest>=8"]

[project.scripts]
orator = "speech_grading.cli:main"

[tool.setuptools.packages.find]
include = ["speech_grading*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
